name: prismgo

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: prismgo
      POSTGRES_PASSWORD: prismgo
      POSTGRES_DB: prismgo
    ports:
      - '${PG_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prismgo -d prismgo']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
