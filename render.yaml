# Render Blueprint: PrismGo demo / UAT on Render's free plan (one web service that
# serves the API and the web app, a Postgres database and a Key Value store).
# Free limits: the service sleeps after 15 min without traffic (keep it awake with an
# uptime check on /api/v1/health), the free database is deleted after 30 days.
services:
  - type: web
    name: prismgo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/render.Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prismgo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: prismgo-redis
          property: connectionString
      - key: APP_ENV
        value: staging
      - key: TRUST_PROXY
        value: 'true'
      # Web app on Vercel (prismgo.blackprism.in) calls this API on api.prismgo.blackprism.in.
      - key: WEB_ORIGIN
        value: https://prismgo.blackprism.in,https://prismgo.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GPS_WEBHOOK_SECRET
        generateValue: true
      # Until WhatsApp templates are approved: codes and messages are logged, and the
      # login code is shown on screen. Anyone with the link can then log in as any
      # registered number: demo data only.
      - key: OTP_CHANNELS
        value: console
      - key: OTP_EXPOSE_CODE
        value: 'true'
      - key: MESSAGING_PROVIDER
        value: console
      - key: OTP_TTL_SECONDS
        value: '300'
      # WhatsApp Cloud API (BlackPrism, +91 70014 41439). WHATSAPP_ACCESS_TOKEN is set in
      # the Render dashboard, never here. Switch OTP_CHANNELS / MESSAGING_PROVIDER to
      # whatsapp (and OTP_EXPOSE_CODE to false) once the templates are approved.
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: '1267308809792402'
      # GPS vendor (Trakzee pull API)
      - key: GPS_PULL_PROVIDER
        value: trakzee
      - key: GPS_PULL_INTERVAL_S
        value: '15'
      - key: GPS_VENDOR_BASE_URL
        value: http://165.22.222.196/webservice
      - key: GPS_VENDOR_PROJECT_ID
        value: '37'
      - key: GPS_VENDOR_USERNAME
        sync: false
      - key: GPS_VENDOR_PASSWORD
        sync: false
      - key: GPS_VENDOR_COMPANY
        sync: false
      # First super admin, created on start if missing (Render free has no shell).
      - key: BOOTSTRAP_ORG
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PHONE
        sync: false

  - type: keyvalue
    name: prismgo-redis
    plan: free
    region: singapore
    # BullMQ queues must never be evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: prismgo-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    databaseName: prismgo
    user: prismgo
